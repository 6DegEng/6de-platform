name: Nightly Postgres backup to Blob

# Dumps the production Postgres (sixde-platform-db-jc / platform) every night
# and uploads it to Azure Blob Storage. The platform DB is the SOLE copy of
# production data — Azure's built-in PITR (7 days) is the first line of
# defense; these dumps are the independent, restorable second line.
#
# ⛔ INERT UNTIL ENABLED: the job refuses to run unless the repo variable
# BACKUP_ENABLED is "true" AND the one-time gated setup exists (storage
# account + 2 role assignments: Storage Blob Data Contributor + Key Vault
# Secrets User) — see docs/backup-setup.md. Merging this file changes
# nothing in production.
#
# CONNECTIVITY: the server's existing AllowAzureServices (0.0.0.0) firewall
# rule covers GitHub-hosted runners, which egress from Azure IPs — no
# firewall step and no extra server-level role needed.
#
# AUTH: same GitHub-OIDC federated identity the deploy workflow uses (no
# stored credentials). The scheduled run executes on main, which matches the
# federated credential subject.

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC ≈ 2:17am ET (3:17am EDT) nightly
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write   # failure step opens an alert issue

concurrency:
  group: pg-backup
  cancel-in-progress: false

env:
  RESOURCE_GROUP: 6de-platform-rg
  PG_SERVER: sixde-platform-db-jc
  PG_DB: platform
  KEYVAULT: sixde-kv-jc
  KV_SECRET: platform-database-url
  STORAGE_ACCOUNT: sixdebackupjc
  CONTAINER: pg-backups

jobs:
  backup:
    # Gate: repo variable BACKUP_ENABLED must be exactly "true".
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Azure login (OIDC — no stored secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # One step on purpose: the password is read, used by pg_dump, and
      # discarded here — it is never written to GITHUB_ENV or any file.
      - name: Read DB secret + pg_dump + integrity smoke check
        run: |
          url=$(az keyvault secret show --vault-name "$KEYVAULT" \
                  --name "$KV_SECRET" --query value -o tsv)
          echo "::add-mask::$url"
          # Parse the URL properly (handles special characters in the
          # password without shell string surgery).
          eval "$(python3 -c '
          import shlex, sys, urllib.parse
          u = urllib.parse.urlsplit(sys.argv[1])
          print("export PGUSER=" + shlex.quote(u.username or ""))
          print("export PGPASSWORD=" + shlex.quote(u.password or ""))
          print("export PGHOST=" + shlex.quote(u.hostname or ""))
          print("export PGPORT=" + shlex.quote(str(u.port or 5432)))
          ' "$url")"
          echo "::add-mask::$PGPASSWORD"
          export PGSSLMODE=require
          stamp=$(date -u +%Y-%m-%d_%H%M)
          file="platform_${stamp}.dump"
          pg_dump --dbname="$PG_DB" -Fc --no-owner --file "$file"
          # Smoke check only: pg_restore --list reads the table of contents,
          # proving the file is a parseable archive — it does NOT verify the
          # data inside. The size checks below add a coarse data signal.
          pg_restore --list "$file" > /dev/null
          size=$(stat -c%s "$file")
          echo "Dump $file is $size bytes"
          # 68 projects + schema should never be near-empty; fail loudly.
          test "$size" -gt 20000
          echo "DUMP_FILE=$file" >> "$GITHUB_ENV"

      - name: Sanity-check size against the newest existing backup
        run: |
          # A dump that suddenly shrank by half likely means data loss or a
          # partial dump — refuse to overwrite history with it.
          prev=$(az storage blob list \
                   --auth-mode login \
                   --account-name "$STORAGE_ACCOUNT" \
                   --container-name "$CONTAINER" \
                   --query "max_by([], &properties.lastModified).properties.contentLength" \
                   -o tsv)
          size=$(stat -c%s "$DUMP_FILE")
          if [ -z "$prev" ] || [ "$prev" = "None" ]; then
            echo "No prior blob — skipping size comparison (first run)."
          elif [ "$size" -lt $((prev / 2)) ]; then
            echo "::error::New dump ($size B) is <50% of the newest existing backup ($prev B)."
            exit 1
          else
            echo "New dump: $size B; newest existing: $prev B — OK."
          fi

      - name: Upload to Blob Storage
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$DUMP_FILE" \
            --file "$DUMP_FILE" -o none
          echo "Uploaded $DUMP_FILE"

      - name: Verify the blob landed
        run: |
          az storage blob show \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$DUMP_FILE" \
            --query "{name:name, size:properties.contentLength}" -o table

      - name: Open an issue on failure (no silent death)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Nightly DB backup FAILED $(date -u +%Y-%m-%d)" \
            --body "The nightly Postgres backup workflow failed. Investigate before the 7-day PITR window closes: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
