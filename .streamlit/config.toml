# 6DE Platform theme — navy + gold "command center" dark (matches 6de.xyz brand).
# This alone recolors all primary widgets from Streamlit's default red (#FF4B4B)
# to brand gold and sets the dark navy base; theme.css (loaded per page) adds
# Inter + chrome and gives gold buttons their navy ink.
[theme]
base = "dark"
primaryColor = "#D4B878"
backgroundColor = "#14152A"
secondaryBackgroundColor = "#1E2140"
textColor = "#EDEEF5"
font = "sans serif"

[server]
headless = true
